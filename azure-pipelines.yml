trigger:
  branches:
    include:
      - develop
      - master
      - feature/*
  paths:
    exclude:
      - .circleci/*
      - .cirrus.yml
      - .drone.star
      - .github/workflows/*
      - .semaphore/*
      - .travis.yml
      - appveyor.yml
      - README.*
pr:
  branches:
    include:
      - develop

variables:
  - { name: co_options, value: "--name container" }

