trigger:
  branches:
    include:
    - develop
    - master
    - feature/*
  paths:
    exclude:
    - .circleci/*
    - .cirrus.yml
    - .drone.star
    - .github/workflows/*
    - .semaphore/*
    - .travis.yml
    - appveyor.yml
    - README.*
pr:
  branches:
    include:
    - develop

variables:
- { name: co_options, value: '--name container' }

resources:
  containers:
    - { container: ubuntu_2404,
        image: 'ubuntu:24.04',
        options: "${{variables.co_options}}" }
    - { container: ubuntu_2204,
        image: 'ubuntu:22.04',
        options: "${{variables.co_options}}" }
    - { container: ubuntu_1804,
        image: 'ubuntu:18.04',
        options: "${{variables.co_options}}",
        volumes: [
          "/node20217:/node20217:rw,rshared",
          "/node20217:/__e/node20:ro,rshared" ] }
    - { container: ubuntu_1604,
        image: 'ubuntu:16.04',
        options: "${{variables.co_options}}",
        volumes: [
          "/node20217:/node20217:rw,rshared",
          "/node20217:/__e/node20:ro,rshared" ] }
